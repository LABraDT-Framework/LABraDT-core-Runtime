# Test-only overrides. Spring Boot reads classpath:/config/ after classpath:/,
# so these keys win over src/main/resources/application.properties while every
# other main setting stays in effect.
#
# Run the app tests on an in-memory H2 database, so they never open or change
# the file database ./data/service-registry in the module folder.
spring.datasource.url=jdbc:h2:mem:sec-test;DB_CLOSE_DELAY=-1

# Engine callback and engine storage. By default the tests send them to a local stub
# engine (StubEngineInitializer, registered in src/test/resources/META-INF/spring.factories),
# which answers at once, so no test waits on a missing engine. With
# -Dtest.engine.url=http://localhost:8080 they go to that real engine instead.
engine.result.endpoint=${test.engine.url:http://localhost:8080}/engine/result
engine.storage.base-url=${test.engine.url:http://localhost:8080}
