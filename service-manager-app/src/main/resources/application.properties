# ═════════════════════════════════════════════════════════════
# Service Manager Application - Configuration
# ═════════════════════════════════════════════════════════════

spring.application.name=service-manager
spring.profiles.active=dev

# Logging Configuration
logging.level.root=INFO
logging.level.de.labradt=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS

# Server Configuration
server.port=8082

# Enables virtual-thread-per-request for Tomcat
# Critical for nested service calls and HTTP communication
spring.threads.virtual.enabled=true

# Application Information
app.name=Service Manager (Service Orchestrator)
app.version=0.0.1-SNAPSHOT
app.description=Service Manager for Digital Twin Runtime Framework

# Docker plugin (runtime-plugins/docker) configuration: change the default 5 minutes timeout for pulling images
# docker.pull.timeout.minutes=5

# Runtime concurrency limits (max simultaneous operations before callers wait for a free permit)
# container.runtime.max-concurrent-containers=10
# external.runtime.max-concurrent-requests=10

# Service execution timeouts
# service.manager.async-timeout-minutes=30
# service.manager.sync-timeout-minutes=2

# Integration with Engine
# Engine callback endpoint where ServiceManager POSTs ExecutionResponseDTO when service completes
engine.result.endpoint=http://localhost:8080/engine/result
# Engine file storage: SCRIPT and CONTAINER services with a fileReference download it
# from {base-url}/engine/storage/{fileReference}. Same value as the code default;
# override with the ENGINE_STORAGE_BASE_URL environment variable (for example in Docker).
engine.storage.base-url=http://localhost:8080

# H2 File-backed Service Registry
spring.datasource.url=jdbc:h2:file:./data/service-registry
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

